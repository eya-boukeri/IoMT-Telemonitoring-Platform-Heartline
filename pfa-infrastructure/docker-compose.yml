services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-pfa-v2
    ports:
      - "1885:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - medtech-network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb-pfa-v2
    ports:
      - "8088:8086"
    volumes:
      - influxdb-data-v2:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: medical_data
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-secret-token
    networks:
      - medtech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: kafka-pfa-v2
    ports:
      - "9093:9093"
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:9093
      - --advertise-kafka-addr internal://kafka-pfa-v2:9092,external://localhost:9093
    networks:
      - medtech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rpk", "topic", "list", "--brokers", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: postgres-pfa
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ingestion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./postgres/create_notification_db.sql:/docker-entrypoint-initdb.d/02_create_notification_db.sql
    networks:
      - medtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-pfa
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: eyaboukari91@gmail.com
      PGADMIN_DEFAULT_PASSWORD: eya
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - medtech-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-pfa
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
    command: start-dev --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medtech-network
    restart: unless-stopped

  vitals-management:
    build: ../vitals-management
    container_name: vitals-management-pfa
    ports:
      - "9090:9090"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-pfa-v2:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-secret-token
      INFLUXDB_ORG: myorg
      INFLUXDB_BUCKET: medical_data
      MQTT_BROKER_URL: tcp://mosquitto:1883
      KAFKA_TOPIC_VITALS: vitals-data
      KAFKA_TOPIC_AGGREGATED: vitals-aggregated
    depends_on:
      - kafka
      - influxdb
      - mosquitto
    networks:
      - medtech-network
    restart: unless-stopped

  ingestion-service:
    build: ../ingestion-service
    container_name: ingestion-service-pfa
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingestion_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-pfa-v2:9092
      MQTT_BROKER_URL: tcp://mosquitto:1883
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-secret-token
      INFLUXDB_ORG: myorg
      INFLUXDB_BUCKET: medical_data
      MQTT_TOPIC_INPUT: vitals/+/data
      SPRING_MQTT_RECEIVE_MAX_SIZE: 500000
    depends_on:
      - postgres
      - kafka
      - mosquitto
      - influxdb
    networks:
      - medtech-network
    restart: unless-stopped

  api-gateway:
    build: ../api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/iot-sante
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/iot-sante/protocol/openid-connect/certs
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/ingestion_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
    depends_on:
      - keycloak
      - postgres
      - vitals-management
      - ingestion-service
    networks:
      - medtech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  medical-dashboard:
    build:
      context: ../medical-dashboard
      args:
        REACT_APP_API_URL: /api
    container_name: medical-dashboard-pfa
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
      - vitals-management
    networks:
      - medtech-network
    restart: unless-stopped

  notification-service:
    build: ../notification-service
    container_name: notification-service-pfa
    restart: on-failure
    ports:
      - "9095:9095"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-pfa-v2:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      NOTIFICATION_DEFAULT_DOCTOR_EMAIL: ${NOTIFICATION_DEFAULT_DOCTOR_EMAIL:-doctor@medtech.com}
      NOTIFICATION_DEFAULT_EMERGENCY_EMAIL: ${NOTIFICATION_DEFAULT_EMERGENCY_EMAIL:-emergency@medtech.com}
      NOTIFICATION_DEFAULT_EMERGENCY_PHONE: ${NOTIFICATION_DEFAULT_EMERGENCY_PHONE:- 33612345678}
    depends_on:
      - kafka
      - postgres
    networks:
      - medtech-network

  data-analytics-service:
    build: ../data-analytics-service
    container_name: data-analytics-service-pfa
    environment:
      KAFKA_BROKERS: kafka-pfa-v2:9092
      KAFKA_TOPIC_OUT: medical-alerts
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-secret-token
      INFLUXDB_ORG: myorg
      INFLUXDB_BUCKET: medical_data
      MODEL_PATH: /app/models/ppg_model.joblib
      POLL_INTERVAL_SECONDS: 10
      QUERY_WINDOW_SECONDS: 300
      CONFIDENCE_THRESHOLD: 0.7
      COOLDOWN_SECONDS: 60
    depends_on:
      - kafka
      - influxdb
    networks:
      - medtech-network

networks:
  medtech-network:
    driver: bridge

volumes:
  influxdb-data-v2:
  postgres-data:
  pgadmin-data:
  keycloak-data: