services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-pfa-v2
    ports:
      - "1885:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - medtech-network

  influxdb:
    image: influxdb:2.7
    container_name: influxdb-pfa-v2
    ports:
      - "8088:8086"
    volumes:
      - influxdb-data-v2:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: medical_data
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-secret-token
    networks:
      - medtech-network

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: kafka-pfa-v2
    ports:
      - "9093:9092"
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
    networks:
      - medtech-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-pfa
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ingestion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - medtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-pfa
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: eyaboukari91@gmail.com
      PGADMIN_DEFAULT_PASSWORD: eya
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - medtech-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: keycloak-pfa
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    command: start-dev
    networks:
      - medtech-network

  vitals-management:
    build: ../vitals-management
    container_name: vitals-management-pfa
    ports:
      - "9090:9090"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: my-secret-token
      INFLUXDB_ORG: myorg
      INFLUXDB_BUCKET: medical_data
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      - kafka
      - influxdb
      - mosquitto
    networks:
      - medtech-network

  ingestion-service:
    build: ../ingestion-service
    container_name: ingestion-service-pfa
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ingestion_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      - postgres
      - kafka
      - mosquitto
    networks:
      - medtech-network

  api-gateway:
    build: ../api-gateway
    container_name: api-gateway-pfa
    ports:
      - "8080:8080"
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/iot-sante
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/iot-sante/protocol/openid-connect/certs
    depends_on:
      - keycloak
      - vitals-management
      - ingestion-service
    networks:
      - medtech-network

  medical-dashboard:
    build: ../medical-dashboard
    container_name: medical-dashboard-pfa
    ports:
      - "5173:80"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    depends_on:
      - api-gateway
      - vitals-management
    networks:
      - medtech-network

networks:
  medtech-network:
    driver: bridge

volumes:
  influxdb-data-v2:
  postgres-data:
  pgadmin-data:
