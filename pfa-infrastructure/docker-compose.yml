version: '3.8'

services:
  # Broker MQTT pour les capteurs (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto-pfa
    ports:
      - "1884:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  # Base de données pour les séries temporelles (InfluxDB)
  influxdb:
    image: influxdb:2.7
    container_name: influxdb-pfa
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: medical_data
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-secret-token

  # Bus d'événements (Kafka via Redpanda - plus léger pour le développement)
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: kafka-pfa
    ports:
      - "9092:9092"
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false

volumes:
  influxdb-data:
