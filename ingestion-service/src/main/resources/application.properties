spring.application.name=ingestion-service

# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8081

# =============================================
# POSTGRESQL CONFIGURATION
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ingestion_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# KAFKA CONFIGURATION
# =============================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-pfa-v2:9092}
spring.kafka.consumer.group-id=ingestion-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka topics
kafka.topic.raw=signals.raw
kafka.topic.filtered=signals.filtered
kafka.topic.aggregated=signals.aggregated
kafka.topic.ingestion=health-ingestion-events
kafka.topic.alerts=medical-alerts

# =============================================
# MQTT CONFIGURATION
# =============================================
mqtt.broker.url=tcp://127.0.0.1:1885
mqtt.client.id=ingestion-service-client
mqtt.topic.input=vitals/+/data
mqtt.qos=1

# =============================================
# PROCESSING CONFIGURATION
# =============================================
processing.aggregation.window-seconds=30
processing.filter.lowpass-cutoff=10
processing.filter.highpass-cutoff=0.5
processing.filter.outlier-threshold=3.0
processing.sampling-rate=20
processing.motion.threshold-factor=2.5
processing.motion.absolute-threshold=1.5
processing.motion.critical-ratio=0.35
processing.motion.warning-ratio=0.20
processing.motion.lms-learning-rate=0.01

# =============================================
# INFLUXDB CONFIGURATION
# =============================================
influxdb.url=${INFLUXDB_URL:http://localhost:8088}
influxdb.token=${INFLUXDB_TOKEN:my-secret-token}
influxdb.org=${INFLUXDB_ORG:myorg}
influxdb.bucket=${INFLUXDB_BUCKET:medical_data}

# =============================================
# LOGGING
# =============================================
logging.level.com.medtech.ingestion=DEBUG
logging.level.org.springframework.integration.mqtt=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE