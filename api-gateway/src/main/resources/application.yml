server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Base de données R2DBC (reactive) ─────────────────────────────────────────
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/ingestion_db
    username: postgres
    password: postgres

  # ── Sécurité OAuth2 Keycloak ─────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri direct → evite conflit localhost:8180 vs keycloak:8080
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/iot-sante}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/iot-sante/protocol/openid-connect/certs}

  # ── Spring Cloud Gateway ──────────────────────────────────────────────────────
  cloud:
    gateway:

      # CORS global
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Timeouts HTTP client
      httpclient:
        connect-timeout: 5000   # 5 secondes
        response-timeout: 30s

      routes:

        # ── PUBLIC : health sans token ──────────────────────────────────────────
        - id: health-public
          uri: http://localhost:8080
          predicates:
            - Path=/health
          filters:
            - SetPath=/actuator/health

        # ── ROLE_MEDECIN : biosignaux patients ──────────────────────────────────
        - id: vitals-management
          uri: http://vitals-management:9090
          predicates:
            - Path=/api/vitals/**
          filters:
            - RewritePath=/api/vitals/(?<segment>.*), /${segment}

        # ── ROLE_DEVICE : ingestion depuis smartwatch ───────────────────────────
        - id: ingestion-service
          uri: http://ingestion-service:8081
          predicates:
            - Path=/api/ingestion/**
          filters:
            - RewritePath=/api/ingestion/(?<segment>.*), /${segment}

        # ── ROLE_MEDECIN : analytics et anomalies ──────────────────────────────
        - id: data-analytics
          uri: http://data-analytics:8085
          predicates:
            - Path=/api/analytics/**
          filters:
            - RewritePath=/api/analytics/(?<segment>.*), /${segment}

        # ── ROLE_MEDECIN : alertes ──────────────────────────────────────────────
        - id: alert-service
          uri: http://alert-service:8082
          predicates:
            - Path=/api/alerts/**
          filters:
            - RewritePath=/api/alerts/(?<segment>.*), /${segment}

        # ── ROLE_MEDECIN : dashboard ────────────────────────────────────────────
        - id: dashboard-service
          uri: http://dashboard-service:5173
          predicates:
            - Path=/api/dashboard/**
          filters:
            - RewritePath=/api/dashboard/(?<segment>.*), /${segment}

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.medtech.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO