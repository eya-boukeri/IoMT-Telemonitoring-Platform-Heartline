# ═══════════════════════════════════════════════════════════════════════════════
# MQTT BROKER CONFIGURATION - Architecture avec 2 CLIENTS
# ═══════════════════════════════════════════════════════════════════════════════
# Architecture: Android SensorApp (CLIENT PUBLISHER) → Mosquitto Broker ← Backend (CLIENT SUBSCRIBER)
#
# CLIENT #1: Android SensorApp
#   - Type: PUBLISHER (envoie les données)
#   - Serveur: tcp://192.168.68.151:1885 (IP externe du PC)
#   - Topic: vitals/+/data
#   - QoS: 2 (garantie de livraison)
#   - Retained: true (conserve le dernier message)
#
# CLIENT #2: Backend Spring Boot (UNE SEULE INSTANCE)
#   - Type: SUBSCRIBER (reçoit les données)
#   - Serveur: tcp://127.0.0.1:1885 (localhost depuis le PC)
#   - Topic: vitals/+/data (exact match)
#   - QoS: 1 (au moins une livraison)
#
# BROKER: Mosquitto (Docker container mosquitto-pfa)
#   - Port interne: 1883 (standard MQTT)
#   - Port externe: 1885 (exposé sur le PC pour Android)
# ═══════════════════════════════════════════════════════════════════════════════

# Backend MQTT Configuration
mqtt.broker.url=tcp://127.0.0.1:1885
mqtt.client.id=vitals-management-backend-client
mqtt.topic.prefix=vitals/+/data
mqtt.qos=1

# Data quality & deduplication settings
mqtt.dedup.enabled=true
mqtt.dedup.ttl.seconds=120

# Logging Configuration - DEBUG pour diagnostic des messages MQTT
# Changez à WARN/INFO dès que le problème est diagnostiqué
logging.level.org.eclipse.paho.client.mqttv3=DEBUG
logging.level.org.springframework.integration.mqtt=DEBUG
logging.level.com.medtech.vitalsmanagement=DEBUG