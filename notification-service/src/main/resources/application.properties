# Server
server.port=9095
spring.application.name=notification-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-pfa-v2:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.alerts=medical-alerts

# Email (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio (SMS)
twilio.account.sid=
twilio.auth.token=
twilio.phone.number=

# Default recipients for testing
notification.default.doctor.email=doctor@medtech.com
notification.default.emergency.email=emergency@medtech.com
notification.default.emergency.phone=+33612345678

# Logging
logging.level.com.medtech.notification=DEBUG