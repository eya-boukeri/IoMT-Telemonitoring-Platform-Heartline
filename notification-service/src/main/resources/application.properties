# Server
server.port=9095
spring.application.name=notification-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka-pfa-v2:9092}
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topic.alerts=medical-alerts

# Email (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio (SMS)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# Default recipients for testing
notification.default.doctor.email=${NOTIFICATION_DEFAULT_DOCTOR_EMAIL:doctor@medtech.com}
notification.default.emergency.email=${NOTIFICATION_DEFAULT_EMERGENCY_EMAIL:emergency@medtech.com}
notification.default.emergency.phone=${NOTIFICATION_DEFAULT_EMERGENCY_PHONE:+33612345678}

# Logging
logging.level.com.medtech.notification=DEBUG